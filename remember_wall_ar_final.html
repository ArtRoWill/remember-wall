<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Remember Wall — AR</title>

  <!-- AR.js + A-Frame -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    /* UI overlay */
    #ui-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top bar */
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 28px 24px 0;
    }

    #title-block h1 {
      font-size: 11px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 215, 100, 0.85);
      font-weight: 400;
    }
    #title-block p {
      font-size: 9px;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-top: 3px;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 80, 80, 0.8);
      margin-top: 4px;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    #status-dot.ready {
      background: rgba(80, 255, 120, 0.9);
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    /* Scan line */
    .scan-line {
      position: fixed;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,200,80,0.2), transparent);
      animation: scanDown 7s linear infinite;
      pointer-events: none;
      z-index: 9998;
    }
    @keyframes scanDown {
      0% { top: 0; opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Corner brackets */
    .corner {
      position: fixed;
      width: 22px;
      height: 22px;
      z-index: 9999;
      pointer-events: none;
    }
    .corner-tl { top: 14px; left: 14px; border-top: 1.5px solid rgba(255,200,80,0.4); border-left: 1.5px solid rgba(255,200,80,0.4); }
    .corner-tr { top: 14px; right: 14px; border-top: 1.5px solid rgba(255,200,80,0.4); border-right: 1.5px solid rgba(255,200,80,0.4); }
    .corner-bl { bottom: 14px; left: 14px; border-bottom: 1.5px solid rgba(255,200,80,0.4); border-left: 1.5px solid rgba(255,200,80,0.4); }
    .corner-br { bottom: 14px; right: 14px; border-bottom: 1.5px solid rgba(255,200,80,0.4); border-right: 1.5px solid rgba(255,200,80,0.4); }

    /* Bottom instruction bar */
    #bottom-bar {
      padding: 0 0 32px;
      text-align: center;
    }

    #instruction {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      padding: 8px 18px;
      border: 1px solid rgba(255,200,80,0.2);
      border-radius: 2px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Intro splash screen */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0a0a08;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      transition: opacity 0.8s ease;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash-art {
      width: 200px;
      height: 130px;
      object-fit: cover;
      filter: grayscale(100%) brightness(0.6);
      margin-bottom: 32px;
      border: 1px solid rgba(255,200,80,0.15);
    }

    #splash h1 {
      font-size: 15px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(255, 215, 100, 0.9);
      font-weight: 400;
      margin-bottom: 6px;
    }
    #splash p {
      font-size: 9px;
      letter-spacing: 0.28em;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    #splash-instructions {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.1em;
      line-height: 1.9;
      text-align: center;
      margin-bottom: 44px;
      max-width: 280px;
    }
    #splash-instructions strong {
      color: rgba(255,215,100,0.75);
      font-weight: 400;
    }

    #start-btn {
      pointer-events: all;
      background: transparent;
      border: 1px solid rgba(255,200,80,0.5);
      color: rgba(255,200,80,0.85);
      font-family: 'Georgia', serif;
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      padding: 14px 32px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #start-btn:hover, #start-btn:active {
      background: rgba(255,200,80,0.1);
      border-color: rgba(255,200,80,0.8);
      color: rgba(255,200,80,1);
    }

    /* Marker download hint */
    #marker-hint {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99998;
      pointer-events: all;
      text-align: center;
      display: none;
    }
    #marker-hint a {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,200,80,0.5);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,200,80,0.2);
      padding-bottom: 2px;
    }

    /* Vignette */
    #vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
      z-index: 9997;
    }
  </style>
</head>
<body>

<!-- ====== SPLASH SCREEN ====== -->
<div id="splash">
  <img id="splash-art" src="" alt="Remember Wall artwork">
  <h1>Remember Wall</h1>
  <p>Augmented Reality Experience</p>
  <div id="splash-instructions">
    Point your camera at the<br>
    <strong>Hiro marker</strong> to activate.<br><br>
    Print or display the marker<br>
    on any screen or surface.
  </div>
  <button id="start-btn">Activate Camera</button>
</div>

<!-- ====== AR SCENE ====== -->
<a-scene
  id="ar-scene"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  renderer="logarithmicDepthBuffer: true; antialias: true;"
  vr-mode-ui="enabled: false"
  style="display:none;"
>

  <!-- Assets -->
  <a-assets>
    <img id="artwork" src="" crossorigin="anonymous">
    <a-mixin id="float-anim"
      animation="property: position; to: 0 0.08 0; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
    </a-mixin>
  </a-assets>

  <!-- Hiro marker -->
  <a-marker preset="hiro" id="hiro-marker">

    <!-- Main artwork plane — floats above the marker -->
    <a-plane
      id="art-plane"
      src="#artwork"
      width="2.5"
      height="1.6"
      position="0 0.05 0"
      rotation="-90 0 0"
      animation="property: position; from: 0 0.05 0; to: 0 0.18 0; dur: 3200; dir: alternate; loop: true; easing: easeInOutSine"
      animation__rot="property: rotation; from: -90 -1 0; to: -90 1 0; dur: 6000; dir: alternate; loop: true; easing: easeInOutSine"
      shadow="receive: false"
    ></a-plane>

    <!-- Warm amber glow plane behind artwork -->
    <a-plane
      width="2.9"
      height="1.95"
      position="0 0.01 0.01"
      rotation="-90 0 0"
      material="color: #c8720a; opacity: 0.18; transparent: true; shader: flat"
      animation="property: material.opacity; from: 0.12; to: 0.28; dur: 2400; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-plane>

    <!-- Particle ring orbiting the artwork -->
    <a-entity id="orbit-ring" rotation="-90 0 0"
      animation="property: rotation; from: -90 0 0; to: -90 360 0; dur: 14000; loop: true; easing: linear">
      <a-torus
        radius="1.6" radius-tubular="0.006"
        material="color: #ffcc44; opacity: 0.35; transparent: true; shader: flat"
        rotation="0 0 0"
      ></a-torus>
    </a-entity>

    <!-- Second tilted orbit ring -->
    <a-entity rotation="-60 0 0"
      animation="property: rotation; from: -60 0 0; to: -60 -360 0; dur: 20000; loop: true; easing: linear">
      <a-torus
        radius="1.9" radius-tubular="0.004"
        material="color: #ff6622; opacity: 0.2; transparent: true; shader: flat"
      ></a-torus>
    </a-entity>

    <!-- Floating light orbs -->
    <a-sphere position="1.2 0.4 0" radius="0.06"
      material="color: #ffdd88; emissive: #ffaa22; emissiveIntensity: 0.9; transparent: true; opacity: 0.75; shader: flat"
      animation="property: position; from: 1.2 0.4 0; to: 1.2 0.7 0.3; dur: 2800; dir: alternate; loop: true; easing: easeInOutSine"
      animation__fade="property: material.opacity; from: 0.75; to: 0.2; dur: 2000; dir: alternate; loop: true;">
    </a-sphere>

    <a-sphere position="-1.1 0.3 0.2" radius="0.05"
      material="color: #ff8844; emissive: #ff4411; emissiveIntensity: 0.8; transparent: true; opacity: 0.6; shader: flat"
      animation="property: position; from: -1.1 0.3 0.2; to: -1.3 0.6 -0.2; dur: 3500; dir: alternate; loop: true; easing: easeInOutSine"
      animation__fade="property: material.opacity; from: 0.6; to: 0.15; dur: 2600; dir: alternate; loop: true;">
    </a-sphere>

    <a-sphere position="0.2 0.5 1.0" radius="0.04"
      material="color: #aaddff; emissive: #2277ff; emissiveIntensity: 0.7; transparent: true; opacity: 0.5; shader: flat"
      animation="property: position; from: 0.2 0.5 1.0; to: -0.3 0.8 0.8; dur: 4100; dir: alternate; loop: true; easing: easeInOutSine"
      animation__fade="property: material.opacity; from: 0.5; to: 0.1; dur: 3000; dir: alternate; loop: true;">
    </a-sphere>

    <!-- Ground shadow plane -->
    <a-plane
      width="3" height="2"
      position="0 0 0"
      rotation="-90 0 0"
      material="color: #000000; opacity: 0.22; transparent: true; shader: flat"
    ></a-plane>

    <!-- Title text above artwork -->
    <a-text
      value="REMEMBER WALL"
      position="0 0.55 0"
      rotation="-90 0 0"
      align="center"
      color="#ffd060"
      width="3.5"
      font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
      opacity="0.85"
      animation="property: opacity; from: 0.85; to: 0.3; dur: 2500; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-text>

  </a-marker>

  <!-- Camera -->
  <a-entity camera></a-entity>

</a-scene>

<!-- ====== UI CHROME ====== -->
<div id="ui-overlay" style="display:none;">
  <div id="top-bar">
    <div id="title-block">
      <h1>Remember Wall</h1>
      <p>AR Experience</p>
    </div>
    <div id="status-dot"></div>
  </div>
  <div id="bottom-bar">
    <div id="instruction">Point camera at Hiro marker</div>
  </div>
</div>

<div id="vignette" style="display:none;"></div>
<div class="scan-line" style="display:none;" id="scan-line"></div>
<div class="corner corner-tl" style="display:none;" id="c1"></div>
<div class="corner corner-tr" style="display:none;" id="c2"></div>
<div class="corner corner-bl" style="display:none;" id="c3"></div>
<div class="corner corner-br" style="display:none;" id="c4"></div>

<div id="marker-hint">
  <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank">
    ↓ Download Hiro Marker
  </a>
</div>

const dataUrl = 'data:image/jpeg;base64,' + IMG_DATA;
document.getElementById('artwork').setAttribute('src', dataUrl);
document.getElementById('splash-art').setAttribute('src', dataUrl);

// ---- Splash → AR transition ----
document.getElementById('start-btn').addEventListener('click', () => {
  const splash = document.getElementById('splash');
  splash.classList.add('hidden');
  setTimeout(() => {
    splash.style.display = 'none';
    // Show AR scene + UI
    document.getElementById('ar-scene').style.display = 'block';
    document.getElementById('ui-overlay').style.display = 'flex';
    document.getElementById('vignette').style.display = 'block';
    document.getElementById('scan-line').style.display = 'block';
    document.getElementById('c1').style.display = 'block';
    document.getElementById('c2').style.display = 'block';
    document.getElementById('c3').style.display = 'block';
    document.getElementById('c4').style.display = 'block';
    document.getElementById('marker-hint').style.display = 'block';
  }, 800);
});

// ---- Marker detection feedback ----
document.addEventListener('DOMContentLoaded', () => {
  const marker = document.getElementById('hiro-marker');
  const dot = document.getElementById('status-dot');
  const instruction = document.getElementById('instruction');

  if (marker) {
    marker.addEventListener('markerFound', () => {
      dot.classList.add('ready');
      instruction.textContent = 'Marker detected — hold steady';
    });
    marker.addEventListener('markerLost', () => {
      dot.classList.remove('ready');
      instruction.textContent = 'Point camera at Hiro marker';
    });
  }
});
</script>
