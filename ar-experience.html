<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remember Wall - AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin:0; padding:0; }
    html, body { width:100%; height:100%; background:#000; }
    #loading { position:fixed; inset:0; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
    #loading.hidden { opacity:0; }
    #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
    canvas { position:fixed; inset:0; z-index:2; }
    a-scene { position:fixed !important; inset:0 !important; z-index:3 !important; }
  </style>
</head>
<body>
<div id="loading">
  <p style="color:#f0e8d0; font-size:24px; text-transform:uppercase;">Remember Wall</p>
  <p style="color:#666; font-size:12px; margin-top:40px;">Camera opening...</p>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<a-scene renderer="alpha: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0"></a-camera>
  <a-plane position="0 0 -1.5" width="3.2" height="2.56" material="shader: nebula; transparent: true; side: double;"></a-plane>
</a-scene>

<script>
AFRAME.registerShader('nebula', {
  schema: { time: { type: 'time', is: 'uniform' } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float time;
    varying vec2 vUv;
    
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    
    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 6; i++) {
        v += a * noise(p);
        p *= 2.07;
        a *= 0.5;
      }
      return v;
    }
    
    void main() {
      vec2 uv = vUv;
      float t = time * 0.0005;
      
      float n = fbm(uv * 2.5 + vec2(t * 0.5, t * 0.35));
      float w1 = sin(uv.x * 10.0 + t * 2.0) * 0.5 + 0.5;
      float w2 = sin(uv.y * 8.0 + t * 1.5) * 0.5 + 0.5;
      float w = w1 * w2;
      
      float lum = n * 0.6 + w * 0.4;
      lum = 0.2 + lum * 0.6;
      lum *= 0.8 + 0.2 * sin(t * 1.5);
      
      float alpha = min(lum * 0.65, 1.0);
      gl_FragColor = vec4(vec3(lum), alpha);
    }
  `
});

const video = document.getElementById('video');
const loading = document.getElementById('loading');

navigator.mediaDevices.getUserMedia({ 
  video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
})
.then(stream => {
  video.srcObject = stream;
  video.play().catch(e => console.log('Play:', e));
  setTimeout(() => { loading.classList.add('hidden'); }, 1200);
})
.catch(e => {
  console.log('Camera error:', e);
  loading.innerHTML = '<p style="color:#ff9999;">Camera access denied</p>';
});
</script>

</body>
</html>
