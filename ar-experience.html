<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remember Wall - AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin:0; padding:0; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }
    #loading { position:fixed; inset:0; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
    #loading.hidden { opacity:0; pointer-events:none; }
    #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
    a-scene { position:fixed !important; inset:0 !important; z-index:2 !important; }
  </style>
</head>
<body>
<div id="loading">
  <p style="color:#f0e8d0; font-size:24px; text-transform:uppercase; margin-bottom:20px;">Remember Wall</p>
  <div style="width:80px; height:80px; border:1px solid #888; border-radius:50%; margin:20px 0; animation:spin 1.8s infinite;"></div>
  <p style="color:#666; font-size:12px; margin-top:30px;">Activating camera...</p>
</div>

<video id="video" autoplay playsinline muted></video>
