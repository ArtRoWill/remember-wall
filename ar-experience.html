<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remember Wall - AR</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin:0; padding:0; }
    html, body { width:100%; height:100%; background:#000; }
    #loading-screen { position:fixed; inset:0; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
    #loading-screen.hidden { opacity:0; pointer-events:none; }
    .load-title { font-size:clamp(22px,6vw,38px); color:#f0e8d0; text-transform:uppercase; }
    .load-sub { font-size:clamp(11px,3vw,14px); color:#888; text-transform:uppercase; margin:20px 0; }
    .pulse-ring { width:80px; height:80px; border-radius:50%; border:1px solid rgba(200,200,200,0.35); animation:pulseRing 1.8s ease-out infinite; }
    @keyframes pulseRing { 0% { transform:scale(0.85); opacity:1; } 100% { transform:scale(1.45); opacity:0; } }
    #scan-prompt { position:fixed; bottom:40px; left:50%; transform:translateX(-50%); background:rgba(8,8,8,0.8); border:1px solid rgba(180,180,180,0.2); border-radius:12px; padding:14px 24px; color:#aaaaaa; font-size:13px; z-index:100; }
    #scan-prompt.hidden { opacity:0; }
    #found-badge { position:fixed; top:24px; right:20px; background:rgba(180,180,180,0.08); border:1px solid rgba(180,180,180,0.3); border-radius:20px; padding:6px 16px; color:#aaaaaa; font-size:11px; z-index:100; opacity:0; transition:opacity 0.4s; }
    #found-badge.visible { opacity:1; }
    a-scene { position:fixed !important; inset:0 !important; }
  </style>
</head>
<body>
<div id="loading-screen">
  <p class="load-title">Remember Wall</p>
  <p class="load-sub">AR Experience</p>
  <div class="pulse-ring"></div>
</div>
<div id="scan-prompt">Point camera at artwork</div>
<div id="found-badge">Active</div>
<a-scene id="ar-scene" mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity id="ar-main" position="0 0 0.002" geometry="primitive: plane; width: 1.3; height: 0.842" material="shader: ar-grayscale; transparent: true; side: double"></a-entity>
    <a-sphere id="orb0" radius="0.038" color="#dedede" transparent="true" opacity="0.20" position="-0.28 0.18 0.06" material="blending: screen"></a-sphere>
    <a-sphere id="orb1" radius="0.048" color="#aaaaaa" transparent="true" opacity="0.16" position="0.32 0.10 0.07" material="blending: screen"></a-sphere>
    <a-torus id="ring0" radius="0.40" radius-tubular="0.007" segments-radial="72" color="#aaaaaa" transparent="true" opacity="0.18" position="0 0 0.04" material="blending: screen"></a-torus>
    <a-torus id="ring1" radius="0.27" radius-tubular="0.005" segments-radial="64" color="#dedede" transparent="true" opacity="0.14" position="0 0 0.06" material="blending: screen"></a-torus>
  </a-entity>
</a-scene>
<script>
AFRAME.registerShader('ar-grayscale', {
  schema: { time: { type: 'time', is: 'uniform' } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform float time; varying vec2 vUv; float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); } float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); } float fbm(vec2 p) { float v = 0.0; float a = 0.5; for (int i = 0; i < 6; i++) { v += a * noise(p); p *= 2.07; a *= 0.5; } return v; } vec2 toPolar(vec2 uv) { vec2 c = uv - 0.5; return vec2(length(c), atan(c.y, c.x)); } void main() { vec2 uv = vUv; float t = time * 0.001; vec2 q = vec2(fbm(uv * 2.5 + vec2(t * 0.38, t * 0.27)), fbm(uv * 2.5 + vec2(t * 0.31 + 5.2, t * 0.42 + 1.3))); vec2 r = vec2(fbm(uv * 2.1 + 4.0 * q + vec2(t * 0.20, 0.0)), fbm(uv * 2.1 + 4.0 * q + vec2(0.0, t * 0.18 + 2.8))); vec2 wUv = uv + 0.13 * r; float base = fbm(wUv * 3.0 + vec2(t * 0.5, t * 0.35)); vec2 polar = toPolar(uv); float radius = polar.x; float angle = polar.y; float spiral = sin(angle * 5.0 - radius * 14.0 + t * 2.8) * 0.5 + 0.5; spiral *= smoothstep(0.52, 0.02, radius); spiral *= 0.28; float rings = sin(radius * 22.0 - t * 4.5) * 0.5 + 0.5; rings = pow(rings, 4.0); rings *= smoothstep(0.50, 0.04, radius) * 0.22; float lum = base * 0.55 + spiral + rings; lum = clamp(lum, 0.0, 1.0); lum = 0.03 + lum * 0.84; float vig = smoothstep(0.55, 0.0, radius); lum *= (0.6 + 0.4 * vig); float breath = 0.88 + 0.12 * sin(t * 1.8); lum *= breath; lum = clamp(lum, 0.0, 1.0); float alpha = smoothstep(0.04, 0.45, lum) * 0.35; gl_FragColor = vec4(vec3(lum), alpha); }'
});
AFRAME.registerComponent('animate', {
  tick(t) { const o0 = document.getElementById('orb0'); if(o0) { const x = -0.28 + 0.1 * Math.sin(t * 0.0007); o0.setAttribute('position', x + ' 0.18 0.06'); } }
});
document.querySelector('a-scene').setAttribute('animate', '');
const scene = document.getElementById('ar-scene');
const loadingScreen = document.getElementById('loading-screen');
scene.addEventListener('loaded', () => { setTimeout(() => { loadingScreen.classList.add('hidden'); }, 1400); });
const target = document.querySelector('[mindar-image-target]');
if(target) {
  target.addEventListener('targetFound', () => { document.getElementById('scan-prompt').classList.add('hidden'); document.getElementById('found-badge').classList.add('visible'); });
  target.addEventListener('targetLost', () => { document.getElementById('scan-prompt').classList.remove('hidden'); document.getElementById('found-badge').classList.remove('visible'); });
}
</script>
</body>
</html>
