<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remember Wall - AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin:0; padding:0; }
    html, body { width:100%; height:100%; background:#000; }
    #loading { position:fixed; inset:0; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
    #loading.hidden { opacity:0; pointer-events:none; }
    .title { font-size:clamp(22px,6vw,38px); color:#f0e8d0; text-transform:uppercase; }
    .sub { font-size:clamp(11px,3vw,14px); color:#888; text-transform:uppercase; margin:20px 0; }
    .ring { width:80px; height:80px; border-radius:50%; border:1px solid rgba(200,200,200,0.35); animation:spin 1.8s ease-out infinite; }
    @keyframes spin { 0% { transform:scale(0.85); opacity:1; } 100% { transform:scale(1.45); opacity:0; } }
    a-scene { position:fixed !important; inset:0 !important; }
  </style>
</head>
<body>
<div id="loading">
  <p class="title">Remember Wall</p>
  <p class="sub">AR Experience</p>
  <div class="ring"></div>
</div>
<a-scene id="scene" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0"></a-camera>
  <a-plane position="0 0 -2" width="2.6" height="1.684" material="shader: glow; transparent: true; side: double"></a-plane>
  <a-sphere position="-0.5 0.3 -1.8" radius="0.1" color="#dedede" material="blending: screen; transparent: true; opacity: 0.3"></a-sphere>
  <a-sphere position="0.6 0.2 -1.8" radius="0.12" color="#aaaaaa" material="blending: screen; transparent: true; opacity: 0.2"></a-sphere>
  <a-torus position="0 0 -1.8" radius="0.6" radius-tubular="0.01" color="#aaaaaa" material="blending: screen; transparent: true; opacity: 0.2"></a-torus>
</a-scene>
<script>
AFRAME.registerShader('glow', {
  schema: { time: { type: 'time', is: 'uniform' } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform float time; varying vec2 vUv; float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); } float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); } float fbm(vec2 p) { float v = 0.0; float a = 0.5; for (int i = 0; i < 6; i++) { v += a * noise(p); p *= 2.07; a *= 0.5; } return v; } void main() { vec2 uv = vUv; float t = time * 0.001; float n = fbm(uv * 3.0 + vec2(t * 0.5, t * 0.35)); float spiral = sin(length(uv - 0.5) * 20.0 - t * 3.0) * 0.5 + 0.5; float rings = sin(length(uv - 0.5) * 30.0 - t * 2.0) * 0.5 + 0.5; float lum = n * 0.6 + spiral * 0.2 + rings * 0.2; lum = 0.05 + lum * 0.8; float alpha = lum * 0.35; gl_FragColor = vec4(vec3(lum), alpha); }'
});
const scene = document.getElementById('scene');
scene.addEventListener('loaded', () => {
  setTimeout(() => { document.getElementById('loading').classList.add('hidden'); }, 1200);
});
let time = 0;
function animate() {
  time += 16;
  const sphere0 = document.querySelector('a-sphere[position="-0.5 0.3 -1.8"]');
  const sphere1 = document.querySelector('a-sphere[position="0.6 0.2 -1.8"]');
  const torus = document.querySelector('a-torus');
  if(sphere0) sphere0.setAttribute('position', (-0.5 + 0.15 * Math.sin(time * 0.001)) + ' 0.3 -1.8');
  if(sphere1) sphere1.setAttribute('position', (0.6 + 0.15 * Math.cos(time * 0.0008)) + ' 0.2 -1.8');
  if(torus) torus.setAttribute('rotation', '0 0 ' + (time * 0.05 % 360));
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
