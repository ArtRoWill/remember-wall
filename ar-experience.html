<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Remember Wall</title>
<style>
body { margin:0; padding:0; width:100%; height:100vh; background:#000; font-family:Arial; overflow:hidden; }
video { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; display:none; z-index:1; }
canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:2; }
#ui { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; color:white; text-align:center; }
h1 { font-size:36px; margin:0 0 40px 0; }
button { padding:20px 60px; font-size:20px; background:#333; color:white; border:1px solid #666; cursor:pointer; border-radius:5px; }
button:active { background:#555; }
#msg { margin-top:30px; font-size:14px; color:#999; }
</style>
</head>
<body>
<video id="video"></video>
<canvas id="canvas"></canvas>
<div id="ui">
  <h1>Remember Wall</h1>
  <button id="btn">Open Camera</button>
  <div id="msg"></div>
</div>

<script>
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let btn = document.getElementById('btn');
let ui = document.getElementById('ui');
let msg = document.getElementById('msg');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);

let animating = false;

function animate() {
  let t = Date.now() * 0.0001;
  
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  let orbs = [
    {x: canvas.width * 0.5, y: canvas.height * 0.5, r: 200, c: '#888'},
    {x: canvas.width * 0.3, y: canvas.height * 0.4, r: 150, c: '#666'},
    {x: canvas.width * 0.7, y: canvas.height * 0.6, r: 180, c: '#777'}
  ];
  
  for (let i = 0; i < orbs.length; i++) {
    let o = orbs[i];
    let x = o.x + Math.sin(t * 0.5) * 150;
    let y = o.y + Math.cos(t * 0.3) * 120;
    let rad = o.r * (0.7 + 0.3 * Math.sin(t * 1.2));
    
    let g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, o.c);
    g.addColorStop(0.5, '#444');
    g.addColorStop(1, '#000');
    
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.4 + 0.2 * Math.sin(t * 0.8);
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, 6.28);
    ctx.fill();
  }
  
  ctx.globalAlpha = 1;
  
  if (animating) {
    requestAnimationFrame(animate);
  }
}

btn.onclick = function() {
  btn.disabled = true;
  btn.textContent = 'Starting...';
  msg.textContent = '';
  
  navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}}).then(function(stream) {
    video.srcObject = stream;
    video.style.display = 'block';
    ui.style.display = 'none';
    animating = true;
    animate();
  }).catch(function(err) {
    msg.textContent = 'Error: ' + err.name;
    btn.disabled = false;
    btn.textContent = 'Open Camera';
  });
};
</script>
</body>
</html>
