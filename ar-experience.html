<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remember Wall - AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin:0; padding:0; }
    html, body { width:100%; height:100%; background:#000; }
    #loading { position:fixed; inset:0; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
    #loading.hidden { opacity:0; }
    #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
    a-scene { position:fixed !important; inset:0 !important; z-index:2 !important; }
  </style>
</head>
<body>
<div id="loading"><p style="color:#f0e8d0; font-size:24px;">Remember Wall</p><div style="width:80px; height:80px; border:1px solid #888; border-radius:50%; margin:20px 0; animation:spin 1.8s infinite;"></div></div>
<video id="video" autoplay playsinline muted></video>
<a-scene renderer="alpha: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0"></a-camera>
  <a-plane position="0 0 -1.5" width="2.6" height="1.684" material="shader: glow; transparent: true; side: double;"></a-plane>
  <a-sphere position="-0.5 0.3 -1.3" radius="0.1" color="#dedede" material="blending: screen; opacity: 0.3;"></a-sphere>
  <a-torus position="0 0 -1.3" radius="0.6" radius-tubular="0.01" color="#aaaaaa" material="blending: screen; opacity: 0.2;"></a-torus>
</a-scene>
<script>
AFRAME.registerShader('glow', {
  schema: { time: { type: 'time', is: 'uniform' } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform float time; varying vec2 vUv; float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); } float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); } float fbm(vec2 p) { float v = 0.0; float a = 0.5; for (int i = 0; i < 6; i++) { v += a * noise(p); p *= 2.07; a *= 0.5; } return v; } void main() { vec2 uv = vUv; float t = time * 0.001; float n = fbm(uv * 3.0 + vec2(t * 0.5, t * 0.60)); vec2 c = uv - 0.5; float d = length(c); float a_val = atan(c.y, c.x); float sp = sin(a_val * 5.0 - d * 14.0 + t * 2.8) * 0.5 + 0.5; sp *= smoothstep(0.52, 0.02, d) * 0.28; float r = sin(d * 22.0 - t * 4.5) * 0.5 + 0.5; r *= smoothstep(0.50, 0.04, d) * 0.22; float lum = n * 0.55 + sp + r; lum = 0.03 + lum * 0.84; lum *= (0.6 + 0.4 * smoothstep(0.55, 0.0, d)); lum *= 0.88 + 0.12 * sin(t * 1.8); float alpha = smoothstep(0.04, 0.45, lum) * 0.60; gl_FragColor = vec4(vec3(lum), alpha); }'
});
navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
  .then(stream => {
    document.getElementById('video').srcObject = stream;
    document.getElementById('video').play();
    setTimeout(() => { document.getElementById('loading').classList.add('hidden'); }, 1500);
  })
  .catch(err => { document.getElementById('loading').innerHTML = '<p style="color:red;">Camera access needed</p>'; });
let t = 0;
function loop() {
  t += 16;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
