<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remember Wall — AR</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:Georgia,serif; }

    #loading-screen {
      position:fixed; inset:0; background:#080808;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      z-index:999; transition:opacity 0.8s ease;
    }
    #loading-screen.hidden { opacity:0; pointer-events:none; }
    .load-title {
      font-size:clamp(22px,6vw,38px); letter-spacing:0.15em;
      color:#dedede; text-transform:uppercase; margin-bottom:8px;
    }
    .load-sub {
      font-size:clamp(11px,3vw,14px); letter-spacing:0.3em;
      color:#555; text-transform:uppercase; margin-bottom:48px;
    }
    .pulse-ring {
      width:80px; height:80px; border-radius:50%;
      border:1px solid rgba(200,200,200,0.35); position:relative;
      animation:pulseRing 1.8s ease-out infinite;
    }
    .pulse-ring::after {
      content:''; position:absolute; inset:12px; border-radius:50%;
      background:rgba(200,200,200,0.08);
      animation:pulseRing 1.8s ease-out infinite 0.5s;
    }
    @keyframes pulseRing {
      0%   { transform:scale(0.85); opacity:1; }
      100% { transform:scale(1.45); opacity:0; }
    }
    .load-hint {
      margin-top:36px; font-size:12px; color:#444;
      letter-spacing:0.2em; text-transform:uppercase;
      text-align:center; padding:0 32px;
    }

    #scan-prompt {
      position:fixed; bottom:40px; left:50%;
      transform:translateX(-50%);
      background:rgba(8,8,8,0.8);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      border:1px solid rgba(180,180,180,0.2);
      border-radius:12px; padding:14px 24px;
      color:#aaaaaa; font-size:13px; letter-spacing:0.12em;
      text-align:center; z-index:100; white-space:nowrap;
      pointer-events:none; transition:opacity 0.5s ease;
    }
    #scan-prompt.hidden { opacity:0; }

    #found-badge {
      position:fixed; top:24px; right:20px;
      background:rgba(180,180,180,0.08);
      border:1px solid rgba(180,180,180,0.3);
      border-radius:20px; padding:6px 16px;
      color:#aaaaaa; font-size:11px; letter-spacing:0.2em;
      text-transform:uppercase; z-index:100;
      opacity:0; transition:opacity 0.4s ease; pointer-events:none;
    }
    #found-badge.visible { opacity:1; }

    a-scene { position:fixed !important; inset:0 !important; }
  </style>
</head>
<body>

<div id="loading-screen">
  <p class="load-title">Remember Wall</p>
  <p class="load-sub">AR Experience</p>
  <div class="pulse-ring"></div>
  <p class="load-hint">Starting camera…<br>Allow access when prompted</p>
</div>

<div id="scan-prompt">Point camera at the artwork print</div>
<div id="found-badge">✦ Active</div>

     The fluid forms (fbm warp, vortex, radial pulse) carry the
     psychedelic quality; no hue is used anywhere.
     ═══════════════════════════════════════════════════════════ -->
<script>
AFRAME.registerShader('ar-grayscale', {
  schema: {
    time: { type: 'time', is: 'uniform' }
  },

  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,

  fragmentShader: `
    uniform float time;
    varying vec2 vUv;

    // ── Noise primitives ──────────────────────────────────────
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    float noise(vec2 p) {
      vec2 i = floor(p); vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0; float a = 0.5;
      for (int i = 0; i < 6; i++) { v += a * noise(p); p *= 2.07; a *= 0.5; }
      return v;
    }

    // ── Polar / vortex helpers ────────────────────────────────
    vec2 toPolar(vec2 uv) {
      vec2 c = uv - 0.5;
      return vec2(length(c), atan(c.y, c.x));
    }

    void main() {
      vec2 uv = vUv;
      float t  = time * 0.001;

      // ── Domain warp: two layers of fbm displacement ──────────
      vec2 q = vec2(
        fbm(uv * 2.5 + vec2(t * 0.38, t * 0.27)),
        fbm(uv * 2.5 + vec2(t * 0.31 + 5.2, t * 0.42 + 1.3))
      );
      vec2 r = vec2(
        fbm(uv * 2.1 + 4.0 * q + vec2(t * 0.20, 0.0)),
        fbm(uv * 2.1 + 4.0 * q + vec2(0.0, t * 0.18 + 2.8))
      );
      vec2 wUv = uv + 0.13 * r;

      // ── Base luminance from warped fbm ────────────────────────
      float base = fbm(wUv * 3.0 + vec2(t * 0.5, t * 0.35));

      // ── Vortex spiral ─────────────────────────────────────────
      vec2 polar = toPolar(uv);
      float radius = polar.x;
      float angle  = polar.y;
      float spiral = sin(angle * 5.0 - radius * 14.0 + t * 2.8) * 0.5 + 0.5;
      spiral *= smoothstep(0.52, 0.02, radius);   // fade toward edges
      spiral *= 0.28;

      // ── Concentric pulse rings ────────────────────────────────
      float rings = sin(radius * 22.0 - t * 4.5) * 0.5 + 0.5;
      rings = pow(rings, 4.0);                    // sharpen ring edges
      rings *= smoothstep(0.50, 0.04, radius) * 0.22;

      // ── Combine ───────────────────────────────────────────────
      float lum = base * 0.55 + spiral + rings;

      // ── Remap to the artwork's tonal range ───────────────────
      // Artwork dark anchor ~0.03, light anchor ~0.87
      // We keep the deep shadows transparent so the print shows through.
      lum = clamp(lum, 0.0, 1.0);
      lum = 0.03 + lum * 0.84;    // map [0,1] → [0.03, 0.87]

      // ── Radial vignette — brighter toward figure centre ──────
      float vig = smoothstep(0.55, 0.0, radius);
      lum *= (0.6 + 0.4 * vig);

      // ── Breathing pulse ───────────────────────────────────────
      float breath = 0.88 + 0.12 * sin(t * 1.8);
      lum *= breath;

      lum = clamp(lum, 0.0, 1.0);

      // ── Alpha: transparent in the darkest regions so the
      //    print ink shows through; bright areas glow above it ──
      float alpha = smoothstep(0.04, 0.45, lum) * 0.80;

      // Achromatic output — r == g == b always
      gl_FragColor = vec4(vec3(lum), alpha);
    }
  `
});

// ── Animate orbs, rings, brushstrokes ─────────────────────────────────
AFRAME.registerComponent('psychedelic-animate', {
  init() {
    this.orbs = [
      { el:null, id:'orb0', ox:-0.28, oy: 0.18, oz:0.06, amp:0.10, sp:0.00070, ph:0.0 },
      { el:null, id:'orb1', ox: 0.32, oy: 0.10, oz:0.07, amp:0.09, sp:0.00090, ph:1.5 },
      { el:null, id:'orb2', ox:-0.05, oy:-0.18, oz:0.09, amp:0.08, sp:0.00110, ph:3.0 },
      { el:null, id:'orb3', ox: 0.18, oy:-0.22, oz:0.08, amp:0.10, sp:0.00065, ph:4.5 },
      { el:null, id:'orb4', ox: 0.00, oy: 0.25, oz:0.10, amp:0.07, sp:0.00085, ph:2.2 },
    ];
    this.rings = [
      { el:null, id:'ring0', sp: 0.00028 },
      { el:null, id:'ring1', sp:-0.00048 },
      { el:null, id:'ring2', sp: 0.00068 },
    ];
    this.strokes = [
      { el:null, id:'stroke0', base: 22, sp: 0.00042 },
      { el:null, id:'stroke1', base:-18, sp:-0.00058 },
      { el:null, id:'stroke2', base:  8, sp: 0.00050 },
    ];
    this.el.sceneEl.addEventListener('loaded', () => {
      [...this.orbs, ...this.rings, ...this.strokes].forEach(o => {
        o.el = document.getElementById(o.id);
      });
    });
  },

  tick(time) {
    const t = time;

    // Orbs: float and pulse — grayscale tones only
    this.orbs.forEach((o, i) => {
      if (!o.el) return;
      const x  = o.ox + o.amp * Math.sin(t * o.sp * 1000 + o.ph);
      const y  = o.oy + o.amp * 0.7 * Math.cos(t * o.sp * 800 + o.ph + 0.9);
      const sc = 0.75 + 0.32 * Math.sin(t * o.sp * 1200 + o.ph);
      o.el.setAttribute('position', `${x.toFixed(4)} ${y.toFixed(4)} ${o.oz}`);
      o.el.setAttribute('scale', `${sc.toFixed(3)} ${sc.toFixed(3)} ${sc.toFixed(3)}`);

      // Cycle through artwork grays: #868686 → #aaaaaa → #dedede → #f0f0f0
      const grays = ['#868686','#aaaaaa','#c8c8c8','#dedede','#f0f0f0','#dedede','#c8c8c8','#aaaaaa'];
      const gi    = Math.floor((t * 0.0003 + i * 1.6) % grays.length);
      const op    = (0.12 + 0.08 * Math.sin(t * 0.002 + o.ph)).toFixed(3);
      o.el.setAttribute('material',
        `color:${grays[gi]}; transparent:true; opacity:${op}; blending:screen`);
    });

    // Rings: tilt and spin
    this.rings.forEach((r, i) => {
      if (!r.el) return;
      const tx = 28 * Math.sin(t * r.sp * 1000 + i);
      const ty = 18 * Math.cos(t * r.sp * 700  + i * 1.2);
      const tz = (t * r.sp * 36000) % 360;
      r.el.setAttribute('rotation', `${tx.toFixed(2)} ${ty.toFixed(2)} ${tz.toFixed(2)}`);
    });

    // Strokes: gentle wobble
    this.strokes.forEach((s, i) => {
      if (!s.el) return;
      const rz = s.base + 7 * Math.sin(t * s.sp * 1000 + i * 0.8);
      s.el.setAttribute('rotation', `0 0 ${rz.toFixed(2)}`);
    });
  }
});

document.querySelector('a-scene').setAttribute('psychedelic-animate', '');
</script>

<!-- ── UI logic ─────────────────────────────────────────────────────── -->
<script>
  const loadingScreen = document.getElementById('loading-screen');
  const scanPrompt    = document.getElementById('scan-prompt');
  const foundBadge    = document.getElementById('found-badge');
  const scene         = document.getElementById('ar-scene');

  scene.addEventListener('loaded', () => {
    setTimeout(() => {
      loadingScreen.classList.add('hidden');
      setTimeout(() => loadingScreen.style.display = 'none', 900);
    }, 1400);
  });

  const target = document.querySelector('[mindar-image-target]');
  target.addEventListener('targetFound', () => {
    scanPrompt.classList.add('hidden');
    foundBadge.classList.add('visible');
  });
  target.addEventListener('targetLost', () => {
    scanPrompt.classList.remove('hidden');
    foundBadge.classList.remove('visible');
  });
</script>
</body>
