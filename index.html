<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remember Wall</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@100;200;300&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c8a84b;
      --gold-dim: rgba(200,168,75,0.25);
      --paper: #f5efe0;
      --ink: #1a1410;
    }

    body {
      background: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow: hidden;
      position: relative;
    }

    /* Background texture grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(200,168,75,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(120,60,180,0.05) 0%, transparent 55%);
      pointer-events: none;
    }

    /* SVG grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      opacity: 0.4;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    /* Decorative top rule */
    .rule {
      width: 60px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
      margin-bottom: 28px;
    }

    .eyebrow {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 10px;
      letter-spacing: 0.45em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 14px;
      opacity: 0.85;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(38px, 10vw, 58px);
      letter-spacing: 0.08em;
      color: var(--paper);
      line-height: 1.05;
      margin-bottom: 6px;
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
    }

    .subtitle {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 11px;
      letter-spacing: 0.35em;
      color: rgba(245,239,224,0.45);
      text-transform: uppercase;
      margin-bottom: 52px;
    }

    /* CTA button */
    .cta-wrap {
      position: relative;
      margin-bottom: 40px;
    }

    .cta-glow {
      position: absolute;
      inset: -12px;
      border-radius: 60px;
      background: radial-gradient(ellipse, rgba(200,168,75,0.2) 0%, transparent 70%);
      animation: glowPulse 2.4s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .cta {
      position: relative;
      display: block;
      width: 220px;
      padding: 18px 32px;
      border: 1px solid var(--gold);
      border-radius: 60px;
      background: rgba(200,168,75,0.08);
      color: var(--paper);
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 200;
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .cta:hover, .cta:active {
      background: rgba(200,168,75,0.22);
      color: #fff;
    }

    .cam-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    /* Permission note */
    .note {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: rgba(245,239,224,0.3);
      margin-bottom: 52px;
      line-height: 1.8;
    }

    /* Instruction strip */
    .steps {
      width: 100%;
      border-top: 1px solid rgba(200,168,75,0.15);
      padding-top: 28px;
      display: flex;
      gap: 24px;
      justify-content: center;
    }
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .step-num {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 28px;
      color: var(--gold);
      opacity: 0.7;
      line-height: 1;
    }
    .step-text {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100;
      font-size: 9.5px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(245,239,224,0.4);
      text-align: center;
      line-height: 1.6;
    }

    /* Bottom artist mark */
    .footer {
      margin-top: 44px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 12px;
      color: rgba(245,239,224,0.2);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
<div class="wrapper">

  <div class="rule"></div>
  <p class="eyebrow">Augmented Reality</p>

  <h1>Remember<br><em>Wall</em></h1>
  <p class="subtitle">Live Edition</p>

  <div class="cta-wrap">
    <div class="cta-glow"></div>
    <a class="cta" href="ar-experience.html" id="launch-btn">
      <span class="cam-icon">◉</span>
      Open Camera
    </a>
  </div>

  <p class="note">
    Camera access required<br>
    Point at the artwork to begin
  </p>

  <div class="steps">
    <div class="step">
      <span class="step-num">1</span>
      <span class="step-text">Tap<br>Open Camera</span>
    </div>
    <div class="step">
      <span class="step-num">2</span>
      <span class="step-text">Allow<br>Camera Access</span>
    </div>
    <div class="step">
      <span class="step-num">3</span>
      <span class="step-text">Point at<br>the Print</span>
    </div>
    <div class="step">
      <span class="step-num">4</span>
      <span class="step-text">Watch it<br>Come Alive</span>
    </div>
  </div>

  <p class="footer">Original artwork</p>
</div>

<script>
  // If accessed directly from QR (not via a server), navigate to ar-experience.html
  document.getElementById('launch-btn').addEventListener('click', function(e) {
    // Just follows the href — works as long as both files are in the same directory
  });
</script>
</body>
</html>
